# Sample file to compare VS Code colors with PyCharm
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-csv-export
  namespace: "ml-prod"
  labels: &common-labels
    app: lightgbm
    tier: 'full'
spec:
  schedule: "30 5 * * 1"
  suspend: false
  successfulJobsHistoryLimit: 3
  startingDeadlineSeconds: null
  jobTemplate:
    metadata:
      labels: *common-labels
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: exporter
              image: registry.example.com/lightgbm:26.10.6.1
              args: ["--window", "168", "--dry-run"]
              resources:
                requests:
                  cpu: 0.5
                  memory: 2Gi
              env:
                - name: LOG_LEVEL
                  value: INFO
              command:
                - /bin/sh
                - -c
                - |
                  echo "starting export"
                  python -m response_model.csv_export
